<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UN-TAG | Checkout</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>body{font-family:"Inter",sans-serif}.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}</style>
</head>
<body class="flex min-h-screen flex-col bg-[#fff8f5] text-[#311300]" data-page-title="checkout.title">
  <nav class="fixed top-0 z-50 w-full border-b border-orange-100 bg-orange-50/90 px-6 py-4 shadow-sm backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-6">
      <a href="首頁.html"><img alt="UN-TAG mark" class="h-16 w-auto object-contain md:h-20" src="images/untag removebg.png"/></a>
      <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-[#564336]">
        <a href="首頁.html" data-i18n="nav.home"></a>
        <a href="商品頁面.html" data-i18n="nav.collection"></a>
        <a href="產品理念.html" data-i18n="nav.philosophy"></a>
        <a href="journal.html" data-i18n="nav.journal"></a>
        <a href="support.html" data-i18n="nav.support"></a>
      </div>
      <div class="flex items-center gap-4">
        <div data-language-switcher></div>
        <a class="relative" href="商品頁面.html"><span class="material-symbols-outlined">shopping_bag</span><span class="absolute -right-2 -top-2 hidden min-w-5 rounded-full bg-[#964900] px-1.5 py-0.5 text-center text-[10px] font-bold leading-none text-white" data-bag-count>0</span></a>
        <a href="account.html"><span class="material-symbols-outlined">person</span></a>
      </div>
    </div>
  </nav>
  <main class="mx-auto w-full max-w-7xl flex-grow px-4 pb-16 pt-28 md:px-8">
    <div class="mb-10">
      <h1 class="text-3xl font-black" data-i18n="checkout.heading"></h1>
      <p class="mt-2 text-[#564336]" data-i18n="checkout.subheading"></p>
      <a class="mt-4 inline-flex items-center gap-2 text-sm font-semibold text-[#964900]" href="商品頁面.html"><span class="material-symbols-outlined text-base">arrow_back</span><span data-i18n="checkout.back"></span></a>
    </div>
    <div class="grid gap-12 lg:grid-cols-12">
      <div class="space-y-8 lg:col-span-7">
        <section class="rounded-[28px] bg-white p-6 shadow-sm">
          <h2 class="text-2xl font-black" data-i18n="checkout.fastTitle"></h2>
          <div class="mt-5 grid gap-3 sm:grid-cols-3">
            <div class="rounded-2xl bg-[#fff8f5] px-4 py-3 text-sm"><p class="font-bold" data-i18n="checkout.secured"></p><p class="mt-1 text-[#564336]" data-i18n="checkout.securedBody"></p></div>
            <div class="rounded-2xl bg-[#fff8f5] px-4 py-3 text-sm"><p class="font-bold" data-i18n="checkout.freeShip"></p><p class="mt-1 text-[#564336]" data-i18n="checkout.freeShipBody"></p></div>
            <div class="rounded-2xl bg-[#fff8f5] px-4 py-3 text-sm"><p class="font-bold" data-i18n="checkout.easyReturns"></p><p class="mt-1 text-[#564336]" data-i18n="checkout.easyReturnsBody"></p></div>
          </div>
        </section>

        <section>
          <h2 class="mb-4 text-xl font-bold" data-i18n="checkout.shippingAddress"></h2>
          <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div><label class="mb-1 block text-xs font-semibold uppercase tracking-wider" data-i18n="checkout.firstName"></label><input class="w-full rounded-lg border border-[#ddc1b1] bg-white px-4 py-3 outline-none" data-i18n-placeholder="checkout.firstNamePlaceholder" id="first-name" type="text"/></div>
            <div><label class="mb-1 block text-xs font-semibold uppercase tracking-wider" data-i18n="checkout.lastName"></label><input class="w-full rounded-lg border border-[#ddc1b1] bg-white px-4 py-3 outline-none" data-i18n-placeholder="checkout.lastNamePlaceholder" id="last-name" type="text"/></div>
            <div class="md:col-span-2"><label class="mb-1 block text-xs font-semibold uppercase tracking-wider" data-i18n="checkout.street"></label><input class="w-full rounded-lg border border-[#ddc1b1] bg-white px-4 py-3 outline-none" data-i18n-placeholder="checkout.streetPlaceholder" id="street-address" type="text"/></div>
            <div><label class="mb-1 block text-xs font-semibold uppercase tracking-wider" data-i18n="checkout.city"></label><input class="w-full rounded-lg border border-[#ddc1b1] bg-white px-4 py-3 outline-none" data-i18n-placeholder="checkout.cityPlaceholder" id="city" type="text"/></div>
            <div><label class="mb-1 block text-xs font-semibold uppercase tracking-wider" data-i18n="checkout.postal"></label><input class="w-full rounded-lg border border-[#ddc1b1] bg-white px-4 py-3 outline-none" data-i18n-placeholder="checkout.postalPlaceholder" id="postal-code" type="text"/></div>
          </div>
        </section>

        <section>
          <h2 class="mb-4 text-xl font-bold" data-i18n="checkout.payment"></h2>
          <div class="space-y-4">
            <div class="rounded-xl bg-white p-4 text-sm text-[#564336]" data-i18n="checkout.paymentHint"></div>
            <div class="rounded-xl border-2 border-[#964900] bg-white p-4" data-payment-method="card">
              <div class="mb-4 font-bold" data-i18n="checkout.card"></div>
              <div class="grid gap-4">
                <input class="rounded-lg border border-[#ddc1b1] px-4 py-3 outline-none" data-i18n-placeholder="checkout.cardNumber" id="card-number" type="text"/>
                <div class="grid grid-cols-2 gap-4">
                  <input class="rounded-lg border border-[#ddc1b1] px-4 py-3 outline-none" data-i18n-placeholder="checkout.cardExpiry" id="card-expiry" type="text"/>
                  <input class="rounded-lg border border-[#ddc1b1] px-4 py-3 outline-none" data-i18n-placeholder="checkout.cardCvc" id="card-cvc" type="text"/>
                </div>
              </div>
            </div>
            <div class="rounded-xl border border-[#ddc1b1] p-4" data-payment-method="paypal">PayPal</div>
            <div class="rounded-xl border border-[#ddc1b1] p-4" data-payment-method="applepay">Apple Pay</div>
          </div>
        </section>

        <button class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#964900] py-4 text-lg font-bold text-white" id="checkout-submit"><span class="material-symbols-outlined">lock</span><span><span data-i18n="checkout.complete"></span> <span data-total-label>$428.00</span></span></button>
      </div>

      <aside class="lg:col-span-5">
        <div class="sticky top-28 rounded-[28px] bg-white p-8 shadow-sm">
          <h3 class="text-lg font-bold" data-i18n="checkout.summary"></h3>
          <div class="mb-6 mt-6 grid gap-3 sm:grid-cols-2">
            <div class="rounded-2xl bg-[#fff8f5] px-4 py-3 text-sm"><p class="font-bold" data-i18n="checkout.delivery"></p><p class="mt-1 text-[#564336]">Apr 18 - Apr 21</p></div>
            <div class="rounded-2xl bg-[#fff8f5] px-4 py-3 text-sm"><p class="font-bold" data-i18n="checkout.protection"></p><p class="mt-1 text-[#564336]" data-i18n="checkout.protectionBody"></p></div>
          </div>
          <div class="mb-8 space-y-6" id="checkout-items"></div>
          <div class="mb-8 flex gap-2">
            <input class="w-full rounded-lg border border-[#ddc1b1] px-4 py-2 outline-none" data-i18n-placeholder="checkout.discountPlaceholder" id="discount-code" type="text"/>
            <button class="rounded-lg bg-[#ffdcc6] px-4 py-2 text-sm font-bold" data-i18n="checkout.apply" id="apply-discount"></button>
          </div>
          <div class="space-y-3 border-t border-[#ddc1b1] pt-6 text-sm">
            <div class="flex justify-between"><span data-i18n="checkout.subtotal"></span><span id="summary-subtotal">$428.00</span></div>
            <div class="flex justify-between"><span data-i18n="checkout.shipping"></span><span data-i18n="checkout.free"></span></div>
            <div class="flex justify-between"><span data-i18n="checkout.discount"></span><span id="summary-discount">$0.00</span></div>
            <div class="flex justify-between"><span data-i18n="checkout.tax"></span><span id="summary-tax">$0.00</span></div>
            <div class="flex justify-between pt-3 text-xl font-black"><span data-i18n="checkout.total"></span><span id="summary-total">$428.00</span></div>
          </div>
        </div>
      </aside>
    </div>
  </main>
  <script src="site-i18n.js"></script>
  <script src="aura-app.js"></script>
</body>
</html>
