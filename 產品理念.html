<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UN-TAG | Philosophy</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>body{font-family:"Inter",sans-serif}.font-headline{font-family:"Playfair Display",serif}.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}</style>
</head>
<body class="bg-[#fff8f5] text-[#311300]" data-page-title="philosophy.title">
  <nav class="fixed top-0 z-50 w-full border-b border-orange-100 bg-orange-50/90 px-6 py-4 shadow-sm backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-6">
      <a href="首頁.html"><img alt="UN-TAG mark" class="h-16 w-auto object-contain md:h-20" src="untag removebg.png"/></a>
      <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-[#564336]">
        <a href="首頁.html" data-i18n="nav.home"></a>
        <a href="商品頁面.html" data-i18n="nav.collection"></a>
        <a class="text-[#964900]" href="產品理念.html" data-i18n="nav.philosophy"></a>
        <a href="journal.html" data-i18n="nav.journal"></a>
        <a href="support.html" data-i18n="nav.support"></a>
      </div>
      <div class="flex items-center gap-4">
        <div data-language-switcher></div>
        <div class="hidden rounded-full border border-[#ddc1b1] bg-white px-3 py-2 sm:flex sm:items-center">
          <span class="material-symbols-outlined text-sm text-[#564336]">search</span>
          <input class="w-40 bg-transparent pl-2 text-sm outline-none" data-i18n-placeholder="philosophy.search" data-search-input type="text"/>
        </div>
        <a class="relative" href="結帳畫面.html"><span class="material-symbols-outlined">shopping_bag</span><span class="absolute -right-2 -top-2 hidden min-w-5 rounded-full bg-[#964900] px-1.5 py-0.5 text-center text-[10px] font-bold leading-none text-white" data-bag-count>0</span></a>
        <a href="account.html"><span class="material-symbols-outlined">person</span></a>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-7xl px-6 pb-20 pt-28">
    <section class="grid gap-12 lg:grid-cols-2" data-product-detail data-product-name="UN-TAG Core Jacket" data-price="840" data-default-color="Ink Black" data-default-size="S" data-image="Untitled design.png">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2 overflow-hidden rounded-[28px] bg-white shadow-xl"><img alt="Main Product" class="h-full w-full object-cover" src="Untitled design.png"/></div>
        <div class="overflow-hidden rounded-[28px] bg-white shadow-sm"><img alt="Detail View" class="h-full w-full object-cover" src="Untitled design.png"/></div>
        <div class="overflow-hidden rounded-[28px] bg-white shadow-sm"><img alt="Lifestyle View" class="h-full w-full object-cover" src="Untitled design.png"/></div>
      </div>
      <div class="sticky top-32 space-y-8">
        <h1 class="font-headline text-5xl leading-tight" data-i18n="philosophy.productName"></h1>
        <p class="text-2xl font-light text-[#964900]">$840.00</p>
        <p class="leading-8 text-[#564336]" data-i18n="philosophy.productDesc"></p>
        <div>
          <p class="mb-3 text-xs font-bold uppercase tracking-widest" data-i18n="philosophy.selectColor"></p>
          <div class="flex gap-3">
            <button class="h-10 w-10 rounded-full border-2 border-[#964900] bg-zinc-900" data-option-group="color" data-option-value="Ink Black"></button>
            <button class="h-10 w-10 rounded-full border border-[#ddc1b1] bg-neutral-500" data-option-group="color" data-option-value="Steel Grey"></button>
            <button class="h-10 w-10 rounded-full border border-[#ddc1b1] bg-stone-200" data-option-group="color" data-option-value="Bone White"></button>
          </div>
        </div>
        <div>
          <div class="mb-3 flex items-center justify-between">
            <p class="text-xs font-bold uppercase tracking-widest" data-i18n="philosophy.selectSize"></p>
            <button class="text-xs text-[#964900] underline" data-size-guide data-i18n="philosophy.sizeGuide"></button>
          </div>
          <div class="grid grid-cols-4 gap-2">
            <button class="rounded border border-[#ddc1b1] py-3 text-sm" data-option-group="size" data-option-value="XS">XS</button>
            <button class="rounded border-2 border-[#964900] bg-[#ffdcc6] py-3 text-sm font-bold" data-option-group="size" data-option-value="S">S</button>
            <button class="cursor-not-allowed rounded border border-[#ddc1b1] py-3 text-sm text-zinc-400" data-option-group="size" data-option-value="M" data-disabled="true">M</button>
            <button class="rounded border border-[#ddc1b1] py-3 text-sm" data-option-group="size" data-option-value="L">L</button>
          </div>
        </div>
        <div class="flex gap-4">
          <a class="flex-1 rounded-full bg-[#964900] px-6 py-4 text-center text-sm font-bold uppercase tracking-widest text-white" href="結帳畫面.html" data-add-to-cart data-product-name="UN-TAG Core Jacket" data-price="840" data-i18n="philosophy.addToBag"></a>
          <button class="flex h-14 w-14 items-center justify-center rounded-full border border-[#ddc1b1]" data-favorite-button data-product-name="UN-TAG Core Jacket"><span class="material-symbols-outlined">favorite</span></button>
        </div>
      </div>
    </section>

    <section class="mt-24 rounded-[32px] bg-[#ffdcc6]/40 px-8 py-16">
      <p class="text-sm font-bold uppercase tracking-[0.25em] text-[#964900]" data-i18n="philosophy.kicker"></p>
      <h2 class="mt-5 max-w-4xl font-headline text-4xl italic leading-tight" data-i18n="philosophy.quote"></h2>
      <div class="mt-8 grid gap-10 lg:grid-cols-2">
        <div>
          <p class="leading-8 text-[#564336]" data-i18n="philosophy.body1"></p>
          <div class="mt-6 border-l-2 border-[#964900] pl-5">
            <p class="text-xs font-bold uppercase tracking-widest" data-i18n="philosophy.principle"></p>
            <p class="mt-2 text-[#564336]" data-i18n="philosophy.principleBody"></p>
          </div>
        </div>
        <div class="overflow-hidden rounded-[28px] bg-white shadow-lg"><img alt="Artisan at work" class="h-full w-full object-cover" src="Untitled design.png"/></div>
      </div>
    </section>
  </main>
  <script src="site-i18n.js"></script>
  <script src="aura-app.js"></script>
</body>
</html>
