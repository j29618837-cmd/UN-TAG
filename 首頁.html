<!DOCTYPE html>
<html class="scroll-smooth" lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>UN-TAG | Define Your Edge.</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: "Inter", sans-serif; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
  </style>
</head>
<body class="bg-[#fff8f5] text-[#311300]" data-page-title="home.title">
  <nav class="fixed top-0 z-50 w-full border-b border-orange-100 bg-orange-50/90 px-6 py-4 shadow-sm backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-6">
      <a class="flex items-center" href="首頁.html" data-i18n-aria-label="nav.home">
        <img alt="UN-TAG mark" class="h-16 w-auto object-contain md:h-20" src="untag removebg.png"/>
      </a>
      <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-[#564336]">
        <a href="首頁.html" data-i18n="nav.home"></a>
        <a href="商品頁面.html" data-i18n="nav.collection"></a>
        <a href="產品理念.html" data-i18n="nav.philosophy"></a>
        <a href="journal.html" data-i18n="nav.journal"></a>
        <a href="support.html" data-i18n="nav.support"></a>
      </div>
      <div class="flex items-center gap-4">
        <div data-language-switcher></div>
        <a class="relative" href="結帳畫面.html" data-i18n-aria-label="nav.checkout">
          <span class="material-symbols-outlined">shopping_bag</span>
          <span class="absolute -right-2 -top-2 hidden min-w-5 rounded-full bg-[#964900] px-1.5 py-0.5 text-center text-[10px] font-bold leading-none text-white" data-bag-count>0</span>
        </a>
        <a href="account.html" data-i18n-aria-label="nav.account"><span class="material-symbols-outlined">person</span></a>
      </div>
    </div>
  </nav>

  <main class="pt-28">
    <section class="mx-auto grid min-h-[80vh] max-w-7xl items-center gap-10 px-6 py-12 lg:grid-cols-2">
      <div>
        <p class="text-sm font-bold uppercase tracking-[0.25em] text-[#964900]" data-i18n="home.kicker"></p>
        <h1 class="mt-6 text-5xl font-black leading-tight md:text-7xl">
          <span data-i18n="home.heroTitle1"></span><br/>
          <span class="text-[#964900]" data-i18n="home.heroTitle2"></span>
        </h1>
        <p class="mt-6 max-w-xl text-lg leading-8 text-[#564336]" data-i18n="home.heroBody"></p>
        <div class="mt-8 flex flex-wrap gap-4">
          <a class="rounded-full bg-[#964900] px-7 py-4 text-sm font-bold uppercase tracking-widest text-white" href="商品頁面.html" data-i18n="home.ctaShop"></a>
          <a class="rounded-full border border-[#964900] px-7 py-4 text-sm font-bold uppercase tracking-widest text-[#964900]" href="產品理念.html" data-i18n="home.ctaPhilosophy"></a>
        </div>
      </div>
      <div class="overflow-hidden rounded-[32px] bg-white shadow-2xl">
        <img alt="Hero" class="h-full w-full object-cover" src="images/Untitled design.png"/>
      </div>
    </section>

    <section class="border-y border-orange-100 bg-white/80">
      <div class="mx-auto grid max-w-7xl gap-4 px-6 py-4 text-center md:grid-cols-4">
        <div><p class="text-xs font-bold uppercase tracking-[0.2em] text-[#964900]" data-i18n="home.benefit1Title"></p><p class="mt-1 text-sm text-[#564336]" data-i18n="home.benefit1Body"></p></div>
        <div><p class="text-xs font-bold uppercase tracking-[0.2em] text-[#964900]" data-i18n="home.benefit2Title"></p><p class="mt-1 text-sm text-[#564336]" data-i18n="home.benefit2Body"></p></div>
        <div><p class="text-xs font-bold uppercase tracking-[0.2em] text-[#964900]" data-i18n="home.benefit3Title"></p><p class="mt-1 text-sm text-[#564336]" data-i18n="home.benefit3Body"></p></div>
        <div><p class="text-xs font-bold uppercase tracking-[0.2em] text-[#964900]" data-i18n="home.benefit4Title"></p><p class="mt-1 text-sm text-[#564336]" data-i18n="home.benefit4Body"></p></div>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-6 py-20">
      <div class="mb-10 flex items-end justify-between gap-6">
        <div>
          <p class="text-sm font-bold uppercase tracking-[0.25em] text-[#964900]" data-i18n="home.shopByNeed"></p>
          <h2 class="mt-3 text-4xl font-black" data-i18n="home.storefrontTitle"></h2>
        </div>
        <a class="text-sm font-bold text-[#964900]" href="商品頁面.html?sort=popular" data-i18n="home.bestSellerLink"></a>
      </div>
      <div class="grid gap-5 md:grid-cols-3">
        <a class="rounded-[28px] border border-[#ddc1b1] bg-white p-6 shadow-sm" href="商品頁面.html?sort=popular">
          <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#964900]" data-i18n="home.popular"></p>
          <h3 class="mt-5 text-2xl font-black" data-i18n="home.bestSellers"></h3>
          <p class="mt-3 text-sm leading-7 text-[#564336]" data-i18n="home.bestSellersBody"></p>
        </a>
        <a class="rounded-[28px] border border-[#ddc1b1] bg-white p-6 shadow-sm" href="商品頁面.html?q=outerwear">
          <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#964900]" data-i18n="home.sharpLayers"></p>
          <h3 class="mt-5 text-2xl font-black" data-i18n="home.outerwear"></h3>
          <p class="mt-3 text-sm leading-7 text-[#564336]" data-i18n="home.outerwearBody"></p>
        </a>
        <a class="rounded-[28px] border border-[#ddc1b1] bg-white p-6 shadow-sm" href="商品頁面.html?q=essential">
          <p class="text-xs font-bold uppercase tracking-[0.2em] text-[#964900]" data-i18n="home.dailyCore"></p>
          <h3 class="mt-5 text-2xl font-black" data-i18n="home.essentials"></h3>
          <p class="mt-3 text-sm leading-7 text-[#564336]" data-i18n="home.essentialsBody"></p>
        </a>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-6 pb-24" id="new-arrivals">
      <div class="mb-10 flex items-end justify-between gap-6">
        <div>
          <h2 class="text-4xl font-black" data-i18n="home.newArrivals"></h2>
          <p class="mt-2 text-[#564336]" data-i18n="home.newArrivalsBody"></p>
        </div>
        <a class="font-bold text-[#964900]" href="商品頁面.html" data-i18n="home.viewAll"></a>
      </div>
      <div class="grid gap-6 md:grid-cols-4">
        <div class="overflow-hidden rounded-[32px] bg-white shadow-sm md:col-span-2 md:row-span-2">
          <img alt="Arrival 1" class="h-full w-full object-cover" src="images/Untitled design.png"/>
        </div>
        <div class="rounded-[28px] bg-white p-6 shadow-sm md:col-span-2">
          <h3 class="text-2xl font-black" data-i18n="home.knitwearSeries"></h3>
          <p class="mt-3 text-sm leading-7 text-[#564336]" data-i18n="home.knitwearBody"></p>
        </div>
        <div class="rounded-[28px] bg-white p-6 shadow-sm">
          <h3 class="text-xl font-black" data-i18n="home.terraSandals"></h3>
          <p class="mt-2 text-[#964900]">$185</p>
        </div>
        <div class="rounded-[28px] bg-white p-6 shadow-sm">
          <h3 class="text-xl font-black" data-i18n="home.ribbedCrew"></h3>
          <p class="mt-2 text-[#964900]">$65</p>
        </div>
      </div>
    </section>

    <section class="bg-[#ffdcc6]/50 py-20">
      <div class="mx-auto max-w-3xl px-6 text-center">
        <h2 class="text-4xl font-black" data-i18n="home.newsTitle"></h2>
        <p class="mt-4 text-lg leading-8 text-[#564336]" data-i18n="home.newsBody"></p>
        <form class="mt-8 flex flex-col gap-4 md:flex-row" data-newsletter-form>
          <input class="w-full rounded-full border border-[#ddc1b1] bg-white px-6 py-4 outline-none" data-i18n-placeholder="home.newsPlaceholder" type="email"/>
          <button class="rounded-full bg-[#964900] px-8 py-4 font-bold text-white" data-i18n="home.newsCta"></button>
        </form>
      </div>
    </section>
  </main>

  <footer class="border-t border-zinc-200 bg-zinc-50 px-6 py-16">
    <div class="mx-auto grid max-w-7xl gap-8 md:grid-cols-4">
      <div>
        <p class="text-xl font-bold">UN-TAG</p>
        <p class="mt-4 text-sm leading-7 text-zinc-500" data-i18n="footer.tagline"></p>
      </div>
      <div>
        <h4 class="mb-4 font-bold" data-i18n="footer.shop"></h4>
        <ul class="space-y-2 text-sm text-zinc-500">
          <li><a href="商品頁面.html" data-i18n="footer.newArrivals"></a></li>
          <li><a href="商品頁面.html?sort=popular" data-i18n="footer.bestSellers"></a></li>
          <li><a href="商品頁面.html?q=essential" data-i18n="footer.essentials"></a></li>
        </ul>
      </div>
      <div>
        <h4 class="mb-4 font-bold" data-i18n="footer.support"></h4>
        <ul class="space-y-2 text-sm text-zinc-500">
          <li><a href="support.html#shipping" data-i18n="footer.shipping"></a></li>
          <li><a href="support.html#privacy" data-i18n="footer.privacy"></a></li>
          <li><a href="support.html#terms" data-i18n="footer.terms"></a></li>
        </ul>
      </div>
      <div>
        <h4 class="mb-4 font-bold" data-i18n="footer.contact"></h4>
        <ul class="space-y-2 text-sm text-zinc-500">
          <li>124 UN-TAG Studio</li>
          <li>Milan, IT 20121</li>
          <li>concierge@untag.com</li>
        </ul>
      </div>
    </div>
    <p class="mx-auto mt-10 max-w-7xl border-t border-zinc-200 pt-8 text-center text-sm text-zinc-500" data-i18n="footer.copyright"></p>
  </footer>

  <script src="site-i18n.js"></script>
  <script src="aura-app.js"></script>

</html>
